namespace: tatarlang

locust:
  testName: load-test-v2
  image:
    repository: locustio/locust
    tag: "2.43.3"
    pullPolicy: IfNotPresent
  testFile:
    fileName: locustfile.py
    configMapName: load-test-v2-locustfile
    content: |
      from locust import HttpUser, between, task

      class ApiUser(HttpUser):
          wait_time = between(1, 3)

          @task
          def get_events(self):
              self.client.get("/api/v1/events/", name="GET /api/v1/events/")
  scenario:
    host: "http://backend:8000"
    users: 200
    spawnRate: 10
    runTime: "10m"
    workerReplicas: 4
  master:
    autostart: true
    autoquit:
      enabled: true
      timeout: 120
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  worker:
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: locust.tatarlang.local
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls: []
